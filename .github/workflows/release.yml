name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package site
        run: tar -czf sgs-card-viewer-${{ github.ref_name }}.tar.gz -C build .

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: sgs-card-viewer-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
